# Render Blueprint — backend (Express API) ni deploy qilish.
# Render: New -> Blueprint -> shu repozitoriyni tanlang. Maxfiy qiymatlar (sync: false) Render panelida so'raladi.
services:
  - type: web
    name: qurilishdokoni-api
    runtime: node
    rootDir: code/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Supabase -> Connect -> Session pooler URI
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false   # masalan: https://qurilishdokoni.vercel.app
