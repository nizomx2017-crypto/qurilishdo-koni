# Render Blueprint — backend (Express API) ni deploy qilish.
# Render: New -> Blueprint -> shu repozitoriyni tanlang. Maxfiy qiymatlar (sync: false) Render panelida so'raladi.
# Har ishga tushishda bajarilmagan migratsiyalar qo'llanadi (db:migrate — hech narsa o'chirmaydi, idempotent).
# Boshlang'ich admin Render'da avtomatik YARATILMAYDI (kod logga tushmasligi uchun) — README'ga qarang.
services:
  - type: web
    name: qurilishdokoni-api
    runtime: node
    rootDir: code/backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Supabase -> Connect -> Session pooler URI
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # masalan: https://qurilishdokoni.vercel.app (bir nechta bo'lsa vergul bilan)
